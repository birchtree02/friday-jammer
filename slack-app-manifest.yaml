# friday-jammer Slack app manifest.
# Paste this at https://api.slack.com/apps → Create New App → From an app manifest.
# It pre-configures the bot user, slash command, scopes, and event subscription.
#
# NOTE: the manifest cannot create the App-Level Token (xapp-...). After creating
# the app you must still generate one manually — see step 4 in the chat instructions.
display_information:
  name: friday-jammer
  description: Adds Spotify track links shared in a thread to a collaborative playlist.
  background_color: "#1db954"
features:
  bot_user:
    display_name: friday-jammer
    always_online: true
  slash_commands:
    - command: /friday-jammer
      description: Add Spotify track links from this thread to a collaborative playlist
      usage_hint: "[playlist-link]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - app_mentions:read
      - channels:history
      - groups:history
      - chat:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
